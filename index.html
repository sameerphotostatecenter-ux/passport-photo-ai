<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Passport Photo AI</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#172033;background:#f5f8fc}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(920px,100%);background:#fff;border:1px solid #e3e9f2;border-radius:24px;box-shadow:0 18px 60px #16365b18;overflow:hidden}
.header{padding:30px 32px 18px;border-bottom:1px solid #edf1f6}.header h1{margin:0;font-size:30px}.header p{margin:8px 0 0;color:#68758a}
.main{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:28px}.panel{border:1px solid #e5ebf3;border-radius:18px;padding:20px;min-height:360px}
.drop{height:270px;border:2px dashed #c9d5e6;border-radius:15px;display:grid;place-items:center;text-align:center;padding:20px;cursor:pointer;background:#fbfdff;overflow:hidden}
.drop.drag{border-color:#2563eb;background:#eff6ff}.drop img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}.drop strong{display:block;font-size:18px}.drop span{display:block;color:#718096;margin-top:7px;font-size:14px}
input[type=file]{display:none}.actions{display:flex;gap:10px;margin-top:16px}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer}.primary{background:#1769e0;color:white;flex:1}.secondary{background:#eef3f9;color:#26354a}.btn:disabled{opacity:.5;cursor:not-allowed}
.result{height:270px;display:grid;place-items:center;background:#f8fafc;border-radius:15px;overflow:hidden}.result img{max-width:100%;max-height:100%;object-fit:contain}.empty{color:#7a8799;text-align:center;padding:20px}.status{margin-top:13px;font-size:14px;color:#64748b;min-height:20px}.download{display:none;width:100%;margin-top:12px;text-align:center;text-decoration:none}.note{font-size:12px;color:#8994a5;margin-top:12px;line-height:1.5}
@media(max-width:720px){.main{grid-template-columns:1fr}.panel{min-height:auto}.drop,.result{height:300px}}
</style>
</head>
<body>
<div class="card">
  <div class="header"><h1>Passport Photo AI</h1><p>Upload a photo and generate a professional passport-style photo with one click.</p></div>
  <div class="main">
    <section class="panel">
      <h2>1. Upload photo</h2>
      <label class="drop" id="drop">
        <input id="file" type="file" accept="image/png,image/jpeg,image/webp">
        <div id="uploadText"><strong>Click to choose an image</strong><span>or drag & drop • PNG, JPG, WebP • max 10 MB</span></div>
        <img id="preview" hidden alt="Selected photo">
      </label>
      <div class="actions"><button class="btn primary" id="generate" disabled>Create Passport Photo</button><button class="btn secondary" id="clear">Clear</button></div>
      <div class="status" id="status"></div>
      <div class="note">The website uses a fixed prompt; there is no prompt box to edit.</div>
    </section>
    <section class="panel">
      <h2>2. Result</h2>
      <div class="result"><div class="empty" id="empty">Your generated passport photo will appear here.</div><img id="result" hidden alt="Generated passport photo"></div>
      <a class="btn primary download" id="download" download="passport-photo.png">Download image</a>
    </section>
  </div>
</div>
<script>
const fileInput=document.getElementById('file'),drop=document.getElementById('drop'),preview=document.getElementById('preview'),uploadText=document.getElementById('uploadText'),generate=document.getElementById('generate'),clearBtn=document.getElementById('clear'),status=document.getElementById('status'),result=document.getElementById('result'),empty=document.getElementById('empty'),download=document.getElementById('download');
let selected=null;
function setFile(file){if(!file)return;if(!file.type.startsWith('image/')){status.textContent='Please choose an image file.';return}selected=file;preview.src=URL.createObjectURL(file);preview.hidden=false;uploadText.hidden=true;generate.disabled=false;status.textContent='Ready.';}
fileInput.addEventListener('change',()=>setFile(fileInput.files[0]));
['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('drag')}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('drag')}));
drop.addEventListener('drop',e=>setFile(e.dataTransfer.files[0]));
clearBtn.addEventListener('click',()=>{selected=null;fileInput.value='';preview.hidden=true;uploadText.hidden=false;generate.disabled=true;status.textContent='';result.hidden=true;empty.hidden=false;download.style.display='none';});
generate.addEventListener('click',async()=>{if(!selected)return;generate.disabled=true;clearBtn.disabled=true;status.textContent='Creating passport photo…';result.hidden=true;empty.hidden=false;download.style.display='none';try{const fd=new FormData();fd.append('image',selected);const r=await fetch('/api/generate',{method:'POST',body:fd});const data=await r.json();if(!r.ok)throw new Error(data.error||'Generation failed');result.src=data.image;result.hidden=false;empty.hidden=true;download.href=data.image;download.style.display='block';status.textContent='Done.';}catch(e){status.textContent=e.message||'Something went wrong.'}finally{generate.disabled=!selected;clearBtn.disabled=false;}});
</script>
</body>
</html>
